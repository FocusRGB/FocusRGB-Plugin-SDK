name: Build

on:
  pull_request:
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      FOCUSRGB_SPEC_ROOT: ${{ github.workspace }}/build/focusrgb-spec
    steps:
      - uses: actions/checkout@v7
      - name: Check out protocol 1.3
        uses: actions/checkout@v7
        with:
          repository: FocusRGB/FocusRGB
          ref: spec-v1.3.0
          path: build/focusrgb-spec
          sparse-checkout: |
            sdk/spec
            sdk/conformance
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore FocusRGB-Plugin-SDK.slnx
      - run: dotnet build FocusRGB-Plugin-SDK.slnx -c Release --no-restore
      - run: dotnet test --solution FocusRGB-Plugin-SDK.slnx -c Release --no-build
      - name: Verify package, consumer, and template
        shell: pwsh
        run: ./tools/verify-plugin-sdk-package.ps1
