name: Build

on:
  pull_request:
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore FocusRGB-Plugin-SDK.slnx
      - run: dotnet build FocusRGB-Plugin-SDK.slnx -c Release --no-restore
      - run: dotnet test --solution FocusRGB-Plugin-SDK.slnx -c Release --no-build
      - name: Verify package, consumer, and template
        shell: pwsh
        run: ./tools/verify-plugin-sdk-package.ps1
