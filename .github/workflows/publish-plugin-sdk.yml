# Publishes the .NET SDK package after its release tag passes every guard.
name: Publish plugin SDK

on:
  push:
    tags:
      - sdk-dotnet-v*
  workflow_dispatch:
    inputs:
      release_tag:
        description: SDK tag to validate and pack without publishing
        required: true
        default: sdk-dotnet-v1.2.0
        type: string

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Verify release tag and package version
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^sdk-dotnet-v([0-9]+\.[0-9]+\.[0-9]+)$') {
            throw "SDK tags must use sdk-dotnet-vMAJOR.MINOR.PATCH."
          }
          $tagVersion = $Matches[1]
          $project = "dotnet/FocusRgb.PluginSdk/FocusRgb.PluginSdk.csproj"
          [xml]$xml = Get-Content $project
          if ($xml.Project.PropertyGroup.Version -ne $tagVersion) {
            throw "$project version must equal tag version $tagVersion."
          }
          git fetch origin --no-tags `
            "+refs/heads/develop:refs/remotes/origin/develop" `
            "+refs/heads/main:refs/remotes/origin/main"
          if ($LASTEXITCODE -ne 0) { throw "Could not refresh develop and main history." }
          git merge-base --is-ancestor $env:GITHUB_SHA origin/develop
          $developExit = $LASTEXITCODE
          if ($developExit -gt 1) { throw "Could not inspect develop ancestry." }
          $onDevelop = $developExit -eq 0
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          $mainExit = $LASTEXITCODE
          if ($mainExit -gt 1) { throw "Could not inspect main ancestry." }
          $onMain = $mainExit -eq 0
          if (-not ($onDevelop -or $onMain)) { throw "SDK tags must point to develop or main history." }
          exit 0
      - run: dotnet restore FocusRGB-SDK.slnx
      - name: Pack SDK
        run: dotnet pack dotnet/FocusRgb.PluginSdk/FocusRgb.PluginSdk.csproj -c Release --no-restore -o build/packages
      - name: Verify dry run
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem build/packages -Filter *.nupkg)
          if ($packages.Count -ne 1) { throw "Dry run expected one SDK package." }
          $symbols = @(Get-ChildItem build/packages -Filter *.snupkg)
          if ($symbols.Count -ne 1) { throw "Dry run expected one SDK symbol package." }
          Write-Host "Dry run completed for $env:RELEASE_TAG; no package was published."
      - uses: actions/upload-artifact@v7
        with:
          name: focusrgb-plugin-sdk
          path: |
            build/packages/*.nupkg
            build/packages/*.snupkg
          if-no-files-found: error
          retention-days: 1

  publish:
    if: github.event_name == 'push'
    needs: package
    runs-on: windows-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: focusrgb-plugin-sdk
          path: build/packages
      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: maj224
      - name: Publish package
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem build/packages -Filter *.nupkg)
          if ($packages.Count -ne 1) { throw "Publication expected one SDK package." }
          $symbols = @(Get-ChildItem build/packages -Filter *.snupkg)
          if ($symbols.Count -ne 1) { throw "Publication expected one SDK symbol package." }
          if ($symbols[0].BaseName -ne $packages[0].BaseName) {
            throw "SDK package and symbol package identities must match."
          }
          # NuGet pushes the matching .snupkg automatically with its .nupkg.
          dotnet nuget push $packages[0].FullName `
            --source "https://api.nuget.org/v3/index.json" `
            --skip-duplicate `
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          if ($LASTEXITCODE -ne 0) { throw "Package publication failed for $($packages[0].Name)." }
